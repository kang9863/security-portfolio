<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" role="img" aria-label="관리자 전문 검토와 로컬 모델의 역할 분리"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6ee7a8"/></marker></defs><rect width="1040" height="580" fill="#141c18"/><g font-family="Malgun Gothic,system-ui,sans-serif" fill="#eef4ef"><text x="40" y="56" font-size="25" font-weight="700">관리자 전문 검토와 로컬 모델의 역할 분리</text><text x="40" y="86" font-size="16" fill="#a8b8ae">구조도에 기반한 설계 요약</text><rect x="40" y="130" width="300" height="150" fill="#1b2720" stroke="#365241"/><text x="62" y="178" font-size="23" font-weight="700">관리자</text><text x="62" y="217" font-size="17" fill="#a8b8ae">요청과 역할별 작업 조정</text><rect x="370" y="130" width="300" height="150" fill="#1b2720" stroke="#365241"/><text x="392" y="178" font-size="23" font-weight="700">전문 검토</text><text x="392" y="217" font-size="17" fill="#a8b8ae">분석 결론과 근거 확인</text><rect x="700" y="130" width="300" height="150" fill="#1b2720" stroke="#365241"/><text x="722" y="178" font-size="23" font-weight="700">로컬 모델</text><text x="722" y="217" font-size="17" fill="#a8b8ae">로그 정리와 반복 처리 보조</text><rect x="700" y="340" width="300" height="150" fill="#1b2720" stroke="#365241"/><text x="722" y="388" font-size="23" font-weight="700">실행 게이트</text><text x="722" y="427" font-size="17" fill="#a8b8ae">대상 범위와 승인 조건</text><rect x="370" y="340" width="300" height="150" fill="#1b2720" stroke="#365241"/><text x="392" y="388" font-size="23" font-weight="700">도구 실행</text><text x="392" y="427" font-size="17" fill="#a8b8ae">실행 상태와 원본 수집</text><rect x="40" y="340" width="300" height="150" fill="#1b2720" stroke="#365241"/><text x="62" y="388" font-size="23" font-weight="700">증거 대조</text><text x="62" y="427" font-size="17" fill="#a8b8ae">결론과 추가 확인 항목</text><g fill="none" stroke="#6ee7a8" stroke-width="2" marker-end="url(#a)"><path d="M340 205H360"/><path d="M670 205H690"/><path d="M850 280V330"/><path d="M700 415H680"/><path d="M370 415H350"/></g><text x="40" y="545" font-size="16" fill="#a8b8ae">설계의 역할 분리를 설명하며 실제 운영·성능 성과와 구분합니다.</text></g></svg>